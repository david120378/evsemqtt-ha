# Wallbox Watchdog – Add-on Neustart bei Verbindungsverlust
#
# Startet das evseMQTT Add-on automatisch neu wenn der Wallbox-Sensor
# tatsächlich unavailable ist (LWT/availability_topic hat "offline" gemeldet).
#
# Hintergrund:
#   Frühere Version (v0.3.4) prüfte zusätzlich "last_updated > 20 min" als
#   Ersatz-Liveness-Signal, weil der unavailable-State beim allerersten
#   Start nach einer Neuinstallation nicht griff (alte retained Discovery-
#   Config im MQTT-Broker ohne availability_topic). Das hat sich als
#   Bumerang erwiesen: sensor.*_status publiziert per MQTT nur bei
#   Wertänderung — bleibt die Wallbox z.B. im Zustand "Finish Charging"
#   stehen, tickt last_updated über Stunden nicht, obwohl die Wallbox
#   quicklebendig ist (Heartbeats alle ~15 s). Die Bedingung hat dadurch
#   das gesunde Addon alle ~10 Minuten grundlos neu gestartet — inklusive
#   kurzer "unavailable"-Phase bei jedem MQTT-Reconnect.
#
#   Für bereits laufende Instanzen (Discovery-Config enthält availability_topic
#   seit Kern-Feature) ist der reine unavailable-Check zuverlässig und deckt
#   echte Verbindungsverluste ab, ohne False-Positives bei langen Idle-Phasen.
#   Bei einer frischen Neuinstallation mit altem retained Broker-State kann
#   es einmalig nötig sein, die retained Discovery-Topics zu löschen, falls
#   der Watchdog nicht anschlägt.

alias: "Wallbox Watchdog – Add-on Neustart bei Verbindungsverlust"
description: >
  Startet das evseMQTT Add-on neu wenn der Wallbox-Sensor unavailable ist.
mode: single
trigger:
  - platform: time_pattern
    minutes: "/10"
condition:
  - condition: template
    value_template: >
      {{ is_state('sensor.wallbox_evse_bs20_status', 'unavailable') }}
action:
  - data:
      # ACHTUNG: Der Addon-Slug ist instanzspezifisch!
      # Den eigenen Slug finden unter:
      # Einstellungen → Addons → Besen Wallbox WiFi (UDP) → Info → Slug
      # Oder in der HA-URL wenn das Addon geöffnet ist:
      # /hassio/addon/DEIN_SLUG/info
      addon: b043d8c5_evsemqtt
    action: hassio.addon_restart
